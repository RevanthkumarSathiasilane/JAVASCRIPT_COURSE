<!DOCTYPE html>
<html>
  <head>
    <title>DOM-PROJECT</title>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button class="sub-btn" onclick="changeButton();"> Subscribe </button>
    <script>
      function changeButton(){
        const buttonElement = document.querySelector('.sub-btn');
        if(buttonElement.innerHTML === 'Subscribe') buttonElement.innerHTML = 'Subscribed';
        else buttonElement.innerHTML = 'Subscribe';
      }
    </script>
  </body>
</html>
