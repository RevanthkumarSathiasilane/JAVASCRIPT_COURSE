<!DOCTYPE html>
<html>
  <head>
    <title>Function Project</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="

    const computerMove = pickComputerMove();

    let result = '';

    if(computerMove === 'rock') result = 'Tied.';

    else if(computerMove === 'paper') result = 'Lose.';

    else result = 'Won.';

    alert(`You picked rock. Computer picked ${computerMove}. You ${result}`);
    ">Rock</button>


    <button onclick="
    const computerMove = pickComputerMove();

    let result = '';

    if(computerMove === 'rock') result = 'Won.';

    else if(computerMove === 'paper') result = 'Tied.';

    else result = 'Lose.';

    alert(`You picked paper. Computer picked ${computerMove}. You ${result}`);

    ">Paper</button>


    <button onclick="

    const computerMove = pickComputerMove();

    let result = '';

    if(computerMove === 'rock') result = 'Lose.';

    else if(computerMove === 'paper') result = 'Won.';

    else result = 'Tied.';

    alert(`You picked scissors. Computer picked ${computerMove}. You ${result}`);

    ">Scissors</button>

     <script>

      function pickComputerMove(){
        const randomNumber = Math.random();
        let computerMove = '';
        if(randomNumber>=0 && randomNumber<1/3) computerMove = 'rock';
        else if(randomNumber>=1/3 && randomNumber<2/3) computerMove = 'paper';
        else computerMove = 'scissors';
        return computerMove;
      }
      
     </script>
  </body>
</html>
