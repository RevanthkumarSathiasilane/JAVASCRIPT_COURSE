<!DOCTYPE html>
<html>
  <head>
    <title>Objects</title>
  </head>
  <body>
    <script>
       const product = {
         name:'socks',
         price:1090
       };
       console.log(product);
       console.log(product.name);
       console.log(product.price);
       product.name = 'cotton socks';
       console.log(product);
       //update
       product.newProperty = true;
       console.log(product);
       //delete 
       delete product.newProperty;
       console.log(product);
       //typeof
       console.log(typeof product);
    </script>
  </body>
</html>
