<!DOCTYPE html>
<html>
  <head>
    <title>Function Project</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <button onclick="
    playGame('rock');
    ">Rock</button>

    <button onclick="
     playGame('paper');
    ">Paper</button>

    <button onclick="
    playGame('scissors');
    ">Scissors</button>

     <script>
      function playGame(playerMove){
          const computerMove = pickComputerMove();
          let result = '';
          if(playerMove === 'scissors'){
          if(computerMove === 'rock') result = 'Lose.';
          else if(computerMove === 'paper') result = 'Won.';
          else result = 'Tied.';
          }else if(playerMove === 'paper'){
           if(computerMove === 'rock') result = 'Lose.';
           else if(computerMove === 'paper') result = 'Won.';
           else result = 'Tied.';
           } else{
              if(computerMove === 'rock') result = 'Tied.';
              else if(computerMove === 'paper') result = 'Lose.';
              else result = 'Won.';
           }
          alert(`You picked ${playerMove}.Computer picked ${computerMove}. You ${result}`);
      }      
      function pickComputerMove(){
        const randomNumber = Math.random();
        let computerMove = '';
        if(randomNumber>=0 && randomNumber<1/3) computerMove = 'rock';
        else if(randomNumber>=1/3 && randomNumber<2/3) computerMove = 'paper';
        else computerMove = 'scissors';
        return computerMove;
      }

     </script>
  </body>
</html>
