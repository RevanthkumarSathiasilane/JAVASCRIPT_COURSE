<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissor Objects</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="
    playGame('rock');
    ">Rock</button>

    <button onclick="
     playGame('paper');
    ">Paper</button>

    <button onclick="
    playGame('scissors');
    ">Scissors</button>
    
    <button onclick="
    score.wins=0;
    score.losses = 0;
    score.ties=0
    ">Reset Score</button>

     <script>
    const score = JSON.parse(localStorage.getItem('score')) || {
        wins :  0,
        losses : 0,
        ties : 0 
      };
      function playGame(playerMove){
          const computerMove = pickComputerMove();
          let result = '';
          if(playerMove === 'scissors'){
          if(computerMove === 'rock') result = 'Lose.';
          else if(computerMove === 'paper') result = 'Won.';
          else result = 'Tied.';
          }else if(playerMove === 'paper'){
           if(computerMove === 'rock') result = 'Lose.';
           else if(computerMove === 'paper') result = 'Won.';
           else result = 'Tied.';
           } else{
              if(computerMove === 'rock') result = 'Tied.';
              else if(computerMove === 'paper') result = 'Lose.';
              else result = 'Won.';
           }
           if(result === 'Won.') score.wins+=1;
           else if(result === 'Tied.') score.ties+=1;
           else score.losses+=1;
           localStorage.setItem('score',JSON.stringify(score));
          alert(`You picked ${playerMove}.Computer picked ${computerMove}. You ${result}\n
Wins: ${score.wins} Loses: ${score.losses} Ties: ${score.ties}`);
      }      
      function pickComputerMove(){
        const randomNumber = Math.random();
        let computerMove = '';
        if(randomNumber>=0 && randomNumber<1/3) computerMove = 'rock';
        else if(randomNumber>=1/3 && randomNumber<2/3) computerMove = 'paper';
        else computerMove = 'scissors';
        return computerMove;
      }
     </script>
  </body>
</html>
